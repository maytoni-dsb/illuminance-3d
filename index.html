  <style>
    /* Design tokens and components follow the Maytoni design system
       (pages "Estimate of general lighting" and "Maytoni Track Configurator"). */
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    :root{
      color-scheme:light;
      --ink:#000; --ink2:#2e2e2e; --ink3:#5F5F5F; --muted:#8A8A8A;
      --paper:#F0F0F0; --card:#fff; --rule:#E4E4E4; --soft:#F0F0F0; --soft2:#f7f7f7; --line:#CFCFCF;
      --accent:#7C54FE; --accent-hov:#5b34e6; --accent-soft:#DEDAEB; --on-accent:#fff;
      --sel:#000; --on-sel:#fff; --sel-sub:#BDBDBD;
      --err:#EB3D00; --ok:#1D874D; --ok-soft:#ECFFBF;
      --room-bg:#F6F6F5; --view-edge:#7a7a78;
      --sans:"Suisse Intl","SuisseIntl","Suisse","Helvetica Neue",Helvetica,Arial,sans-serif;
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        color-scheme:dark; --ink:#fff; --ink2:#d6d6d6; --ink3:#a3a3a3; --muted:#8a8a8a;
        --paper:#0e0e0f; --card:#161617; --rule:#2c2c2e; --soft:#202022; --soft2:#1a1a1c; --line:#3a3a3d;
        --accent:#9B7DFF; --accent-hov:#b39dff; --accent-soft:#2A2340; --on-accent:#000;
        --sel:#fff; --on-sel:#000; --sel-sub:#555;
        --err:#FF6B3D; --ok:#7fce7f; --ok-soft:#16281a;
        --room-bg:#1B1917; --view-edge:#bdb7ae;
      }
    }
    :root[data-theme="dark"]{
      color-scheme:dark; --ink:#fff; --ink2:#d6d6d6; --ink3:#a3a3a3; --muted:#8a8a8a;
      --paper:#0e0e0f; --card:#161617; --rule:#2c2c2e; --soft:#202022; --soft2:#1a1a1c; --line:#3a3a3d;
      --accent:#9B7DFF; --accent-hov:#b39dff; --accent-soft:#2A2340; --on-accent:#000;
      --sel:#fff; --on-sel:#000; --sel-sub:#555;
      --err:#FF6B3D; --ok:#7fce7f; --ok-soft:#16281a;
      --room-bg:#1B1917; --view-edge:#bdb7ae;
    }
    html,body{height:100%}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
      font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    button,input{font:inherit;color:inherit}
    .wrap{max-width:1920px;height:100%;margin:0 auto;padding:clamp(8px,1.4vw,20px) clamp(8px,1.6vw,28px);
      display:flex;flex-direction:column;gap:16px}

    /* top bar */
    .sbar{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--rule);
      border-radius:12px;padding:8px 14px 8px 20px;min-height:56px;flex:none}
    .brand{display:inline-flex;align-items:center;color:var(--ink);flex:none}
    .brand svg{height:18px;width:auto;display:block}
    /* version 2 in development (spec v2, stage 2.0) */
    .beta{flex:none;font-size:11px;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;background:#c2410c;color:#fff;white-space:nowrap;cursor:help}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;max-width:min(560px,calc(100vw - 32px));
      background:var(--ink);color:var(--card);font-size:13px;line-height:1.4;padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
    .apptitle{font-size:12px;color:var(--ink3);line-height:1.3;flex:none}
    .stagebadge{margin-left:auto;font-size:12px;color:var(--ink3);background:var(--soft);border-radius:999px;padding:6px 12px;white-space:nowrap}
    .themebtn{flex:none;height:36px;width:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);cursor:pointer}
    .themebtn:hover{border-color:var(--ink);color:var(--ink)}

    /* layout: inputs | 3D view | results (≥ 1280 px); inputs | view, results below both (900–1280 px);
       one column below 900 px: view, inputs, results. Side panels are as tall as the 3D view and
       scroll inside. */
    .work{flex:1 1 auto;min-height:0;display:grid;gap:16px;
      grid-template-columns:minmax(0,340px) minmax(0,1fr) minmax(0,320px);grid-template-areas:"form view results"}
    .gscard{background:var(--card);border:1px solid var(--rule);border-radius:12px}
    .side{overflow-y:auto;min-height:0;align-self:stretch;display:flex;flex-direction:column}
    .form{grid-area:form}
    .viewcard{grid-area:view}
    .results{grid-area:results}
    .fsec.compact{padding:16px 20px 18px}
    .fsec{padding:20px 26px 22px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:12px}
    .fsec:first-child{border-top:0}
    .shd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
    .gshint{font-size:12px;color:var(--ink3);line-height:1.4}
    .fsub{font-size:12px;font-weight:600;color:var(--ink2);margin-top:4px}
    .gslink{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer;
      text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
    .gslink:hover{color:var(--accent-hov)}

    /* fields */
    .fgrid{display:grid;gap:8px 12px;align-items:start;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
    .fld{display:flex;flex-direction:column;gap:3px;min-width:0}
    .fld > .fl{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3);height:15px;white-space:nowrap}
    .fld > .fl i{color:var(--muted)}
    .fld > .fl .t{overflow:hidden;text-overflow:ellipsis}
    .fld .ibox{position:relative;display:flex;align-items:center}
    .fld input{height:26px;width:100%;min-width:0;border:1px solid var(--rule);border-radius:5px;padding:0 26px 0 20px;
      font-size:13px;color:var(--ink);background:var(--card);font-variant-numeric:tabular-nums}
    /* up / down arrows on the left of a field (as in InDesign) */
    .fld .spin{position:absolute;left:1px;top:1px;bottom:1px;width:15px;display:flex;flex-direction:column;
      border-right:1px solid var(--rule);border-radius:4px 0 0 4px;overflow:hidden;z-index:1}
    .fld .spin button{flex:1;display:flex;align-items:center;justify-content:center;border:0;padding:0;margin:0;
      background:var(--soft2);color:var(--ink3);cursor:pointer}
    .fld .spin button:hover{background:var(--soft);color:var(--ink)}
    .fld .spin button:active{background:var(--accent-soft);color:var(--accent)}
    .fld .spin button + button{border-top:1px solid var(--rule)}
    .fld input:hover{border-color:var(--line)}
    .fld input:focus{outline:none;border-color:var(--accent)}
    .fld .unit{position:absolute;right:8px;font-size:11.5px;color:var(--muted);pointer-events:none}
    .fld select{height:26px;width:100%;min-width:0;border:1px solid var(--rule);border-radius:5px;padding:0 8px;
      font-size:13px;color:var(--ink);background:var(--card)}
    .fld select:focus{outline:none;border-color:var(--accent)}
    /* help */
    .help{width:17px;height:17px;border-radius:50%;border:0;background:var(--soft);color:var(--ink3);
      font-size:10.5px;font-weight:600;line-height:17px;padding:0;display:inline-flex;align-items:center;justify-content:center;
      cursor:pointer;flex:0 0 auto;font-family:var(--sans)}
    .help:hover,.help[aria-expanded="true"]{background:var(--accent);color:#fff}
    .gschipb.sm{height:22px;padding:0 9px;font-size:11.5px}
    .fsub .gschipb.sm{margin-left:auto;font-weight:500}
    .fsub{display:flex;align-items:center;gap:6px}
    .helppop{position:absolute;z-index:50;max-width:280px;padding:12px 14px;border-radius:10px;background:var(--card);
      color:var(--ink);border:1px solid var(--rule);box-shadow:0 8px 28px rgba(0,0,0,.16);font-size:12.5px;line-height:1.45}
    .helppop .hpt{font-weight:600;margin-bottom:4px}
    .helppop .hpx{color:var(--ink2)}
    .fld.bad input{border-color:var(--err)}
    .fld .ferr{font-size:11px;color:var(--err);line-height:1.3}
    .fld.wide{grid-column:1/-1}
    .gschipb:disabled{opacity:.45;cursor:not-allowed}
    .gschipb:disabled:hover{border-color:var(--rule)}

    /* chips */
    .gschips{display:flex;gap:5px;flex-wrap:wrap}
    .gschipb{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);
      color:var(--ink);font-size:12.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
    .gschipb:hover{border-color:var(--ink)}
    .gschipb[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel);font-weight:600}

    /* key-value rows and tables */
    .gstech{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
    .gstrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
    .gstrow span{color:var(--ink3)}
    .gstrow b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
    .htable{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
    .htable th{text-align:right;font-weight:600;font-size:11.5px;color:var(--ink3);padding:5px 6px;border-bottom:1px solid var(--rule)}
    .htable td{padding:6px;border-bottom:1px solid var(--rule);text-align:right}
    .htable th:first-child,.htable td:first-child{text-align:left;padding-left:0}
    .htable tr:last-child td{border-bottom:0}
    .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

    /* acceptance checks */
    .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
    .checks li{display:grid;grid-template-columns:20px 1fr;gap:2px 6px;font-size:13px;line-height:1.4}
    .checks li::before{grid-row:span 2;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;
      justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
    .checks li.ok::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
    .checks li.bad::before{content:"✕";background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
    .checks small{color:var(--ink3);font-size:12px}

    /* 3D view */
    .viewcard{position:relative;overflow:hidden;min-height:0;background:var(--room-bg);container:view / inline-size}
    #view{position:absolute;inset:0}
    #view canvas{display:block;width:100%;height:100%;cursor:default}
    .vbottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    /* status pill: top centre, level with the view buttons */
    .vtop{position:absolute;top:12px;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    @container view (max-width:760px){ .vtop{top:54px} }
    .vstatus{background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:12px;
      font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vstatus:empty{display:none}
    .vtools .vmenuw{position:relative}
    .vmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:20;min-width:200px;background:var(--card);border:1px solid var(--rule);
      border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px;display:flex;flex-direction:column}
    .vmenu .vmh{font-size:11.5px;color:var(--ink3);padding:4px 8px 6px}
    .vmenu button{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;
      font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left;white-space:nowrap}
    .vmenu button:hover{background:var(--soft)}
    .vmenu button:disabled{color:var(--muted);cursor:default;background:none}
    .vmenu button i{width:14px;flex:none;font-style:normal;color:var(--accent);font-weight:700}
    .vmenu button small{margin-left:auto;padding-left:12px;color:var(--ink3);font-size:11.5px}
    .vbtn .caret{position:absolute;right:3px;bottom:5px}
    .vhint{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
    .vhint b{font-weight:600;color:var(--ink3)}
    /* photometric file: drop zone, luminaire description, compact polar diagram */
    .pfdrop{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border:1.5px dashed var(--line);border-radius:10px;
      color:var(--ink3);font-size:12.5px;cursor:pointer;line-height:1.35;background:var(--soft2);min-height:52px}
    .pfdrop:hover,.pfdrop.dropping{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
    .pfdrop .pft{display:flex;flex-direction:column;min-width:0;flex:1}
    .pfdrop .pft b{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pfdrop .pft span{font-size:11.5px;color:var(--ink3)}
    .pfclear{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;cursor:pointer;flex:none}
    .pfclear:hover{color:var(--err)}
    #estnote.warn,#hmnote.warn{color:var(--err)}
    .pferr{font-size:12px;color:var(--err);line-height:1.4;margin-top:6px}
    .pfcard{display:flex;gap:12px;align-items:stretch;justify-content:space-between}
    .pfdesc{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0;min-height:112px;padding:4px 0;font-size:12.5px;line-height:1.35}
    .pfmid{display:flex;flex-direction:column;gap:2px}
    .pfl1{color:var(--ink3)}
    .pfl2{font-weight:600;font-size:13.5px}
    .pfl3{color:var(--ink2);font-variant-numeric:tabular-nums}
    .pfpolar{width:112px;height:112px;flex:0 0 auto}
    .pfpolar .ring{fill:none;stroke:var(--line);stroke-width:.6}
    .pfpolar .c0{fill:none;stroke:var(--accent);stroke-width:1.6}
    .pfpolar .c90{fill:none;stroke:var(--ink3);stroke-width:1.2;stroke-dasharray:3 2}
    .pfwarn{margin:4px 0 0;padding-left:14px;font-size:11px;color:var(--ink3);line-height:1.35}
    /* results: work planes */
    .planes{display:flex;flex-direction:column}
    .prow{border-bottom:1px solid var(--rule)}
    .prow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:14px 64px 1fr 1fr;align-items:center;gap:6px;
      padding:8px 0;font-size:13px;font-variant-numeric:tabular-nums}
    .prow summary::-webkit-details-marker{display:none}
    .prow summary::before{content:"";width:0;height:0;border-left:5px solid var(--ink3);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .1s}
    .prow[open] summary::before{transform:rotate(90deg)}
    .prow .pn{font-weight:600}
    .prow .pv{display:flex;align-items:center;gap:5px;white-space:nowrap}
    .prow .pv i{font-style:normal;color:var(--ink3)}
    .prow .gstech{padding:0 0 10px 20px}
    .prow summary{grid-template-columns:14px 58px 1fr 1fr 26px}
    .pplan{width:26px;height:24px;border-radius:6px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);
      display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
    .pplan:hover{border-color:var(--ink);color:var(--ink)}
    .pplan[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
    /* calculation: button and the automatic update switch above the results */
    .calcbar{display:flex;align-items:center;gap:12px}
    .gsbtn{height:34px;padding:0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);
      font-size:13px;font-weight:600;cursor:pointer}
    .gsbtn:hover{background:var(--accent-hov)}
    .gsbtn:disabled{background:var(--soft);color:var(--muted);cursor:default}
    .tgl{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}
    .tgl input{appearance:none;-webkit-appearance:none;margin:0;width:32px;height:18px;border-radius:999px;background:var(--line);
      position:relative;cursor:pointer;transition:background .12s;flex:none}
    .tgl input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
      box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s}
    .tgl input:checked{background:var(--accent)}
    .tgl input:checked::after{transform:translateX(14px)}
    .stale{font-size:12px;color:var(--ink3)}
    /* "?" among the view buttons */
    .vbtn.help{width:34px;height:34px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);
      font-size:14px;font-weight:600;line-height:1}
    .vbtn.help:hover,.vbtn.help[aria-expanded="true"]{background:var(--card);border-color:var(--ink);color:var(--ink)}
    .st{display:inline-flex;width:14px;height:14px;flex:0 0 auto}
    .st svg{width:14px;height:14px;display:block}
    .st.low{color:var(--err)} .st.ok{color:var(--ok)} .st.high{color:#E0A100}
    .form.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
    .fatal{padding:24px;color:var(--err)}
    /* calculation in progress: a pill in the upper left corner of the view */
    .vbusy{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:8px;background:var(--card);
      border:1px solid var(--rule);border-radius:999px;padding:7px 12px;font-size:12px;color:var(--ink2);pointer-events:none;
      max-width:calc(100% - 160px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vbusy::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent-soft);
      border-top-color:var(--accent);animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){ .vbusy::before{animation:none} }
    .vbusy.err{color:var(--err)} .vbusy.err::before{display:none}
    /* exposure slider (extra settings) */
    .range{display:flex;align-items:center;gap:10px;font-size:12.5px}
    .range input{flex:1 1 auto;min-width:0;accent-color:var(--accent)}
    .range output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}

    /* false-color legend: fixed 27-level scale along the bottom of the view; each label is the
       lower bound of the color above it (stepped colors) */
    .legend{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 12px 6px;
      display:flex;align-items:flex-start;gap:10px}
    .legend .lt{font-size:11px;color:var(--ink3);white-space:nowrap;line-height:12px}
    .legend ol{list-style:none;margin:0;padding:0;flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(27,minmax(0,1fr))}
    .legend li{display:flex;flex-direction:column;gap:3px;min-width:0}
    .legend li i{height:12px;box-shadow:inset 0 1px 0 rgba(0,0,0,.12),inset 0 -1px 0 rgba(0,0,0,.12)}
    .legend li:first-child i{border-radius:3px 0 0 3px}
    .legend li:last-child i{border-radius:0 3px 3px 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
    .legend li span{font-size:10px;line-height:1;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
    /* fewer labels when the view is narrow (container query on the view card) */
    @container view (max-width:900px){ .legend li:not(.maj) span{visibility:hidden} }
    @container view (max-width:480px){ .legend li:not(.key) span{visibility:hidden} }
    .vtools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
    .vbtn[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
    .vbtn[aria-pressed="true"]:hover{color:var(--on-sel)}
    .vbtn{position:relative;height:34px;width:34px;padding:0;border-radius:999px;border:1px solid var(--rule);
      background:var(--card);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .vbtn:hover{border-color:var(--ink);color:var(--ink)}
    /* tooltip: shown at once on hover and keyboard focus (the native title waits about a second) */
    .vbtn[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;
      background:var(--sel);color:var(--on-sel);font-size:12px;line-height:1;padding:6px 9px;border-radius:6px;
      pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .08s,transform .08s;z-index:5}
    .vbtn[data-tip]:hover::after,.vbtn[data-tip]:focus-visible::after{opacity:1;transform:none}
    @media (hover:none){ .vbtn[data-tip]::after{display:none} }


    /* stages in the top bar (as in Maytoni Track Configurator): number, name; the current one filled */
    .stnav{display:flex;align-items:center;gap:8px;margin:0 auto}
    .hbtns{display:flex;align-items:center;gap:2px;margin-left:12px}
    .hib{width:34px;height:34px;border-radius:999px;border:0;background:transparent;color:var(--ink);display:inline-grid;place-items:center;padding:0;cursor:pointer}
    .hib:hover:not(:disabled){background:var(--soft)}
    .hib:disabled{opacity:.35;cursor:default}
    .hsep{width:1px;height:20px;background:var(--rule);margin:0 4px}
    .langw{position:relative}
    .langpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.02em;cursor:pointer}
    .langmenu{min-width:180px;padding:6px;border-radius:12px}
    .langmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:13px;text-align:left;color:var(--ink);cursor:pointer}
    .langmenu button:hover{background:var(--soft)}
    .langmenu b{width:22px;color:var(--ink3);font-weight:600}
    .langmenu span{flex:1}
    .langmenu i{font-style:normal}
    .gsst{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 16px 0 6px;border-radius:999px;border:0;
      background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
    .gsst .gsn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;
      align-items:center;justify-content:center;font-size:13px;flex:none}
    .gsst.cur{background:var(--sel);color:var(--on-sel);font-weight:600}
    .gsst.cur .gsn{background:var(--accent);border-color:var(--accent);color:#fff}
    .gsst.done{color:var(--ink)}
    .gsst.done .gsn{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
    .gsst:not(.cur):hover{background:var(--soft);color:var(--ink)}
    .gsst .gsc{display:inline-flex;margin-left:-4px;opacity:.75}
    .gsst .gsrn{max-width:220px;overflow:hidden;text-overflow:ellipsis}
    .gsln{width:28px;height:1px;background:var(--line);flex:none}
    .gsln.on{background:var(--ink)}
    .stroomw{position:relative}
    .gssplit{padding:0;gap:0;cursor:default}
    .gssplit button{height:100%;border:0;background:none;color:inherit;font:inherit;display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap}
    .gssplit .gsl{gap:10px;padding:0 12px 0 6px;border-radius:999px 0 0 999px}
    .gssplit .gsr{gap:8px;padding:0 14px 0 12px;border-radius:0 999px 999px 0;position:relative;font-weight:400}
    .gssplit .gsr::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:currentColor;opacity:.3}
    .gssplit:not(.cur) button:hover{background:var(--soft);color:var(--ink)}
    .gssplit.cur:hover{background:var(--sel)}
    .gssplit.cur button:hover{background:color-mix(in srgb,var(--on-sel) 12%,transparent)}
    .gssplit .gsc{margin-left:0;opacity:.85}
    /* norms: the "Choose" button, source line, codifier dialog */
    .fsub .gslink{margin-left:auto;font-weight:500}
    .normsrc{font-size:11.5px;color:var(--ink3);margin-top:-2px;line-height:1.35}
    .fgrid[data-group="norm"]{align-items:end}
    .fgrid[data-group="norm"] .fl{white-space:normal;height:auto;line-height:1.25}
    .normsrc b{font-weight:600;color:var(--ink2)}
    .ndlg{width:min(1000px,94vw);height:min(86vh,940px);max-width:none;max-height:none;padding:0;border:1px solid var(--rule);border-radius:12px;
      background:var(--card);color:var(--ink);box-shadow:0 24px 80px -20px rgba(0,0,0,.45)}
    .ndlg[open]{display:flex;flex-direction:column}
    .ndlg::backdrop{background:rgba(0,0,0,.38)}
    .ndhead{display:flex;align-items:flex-start;gap:16px;padding:22px 26px 14px}
    .ndhead .gshd{flex:1}
    .ndclose{width:34px;height:34px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);font-size:18px;line-height:1;cursor:pointer;flex:none}
    .ndclose:hover{border-color:var(--ink);color:var(--ink)}
    .ndbar{display:flex;gap:12px;align-items:center;padding:0 26px 14px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
    .seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--soft);gap:2px;flex:none}
    .seg button{height:32px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--ink3);font-size:13px;cursor:pointer;white-space:nowrap}
    .seg button:hover{color:var(--ink)}
    .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--rule)}
    .nsearch{position:relative;flex:1 1 260px;min-width:200px}
    .nsearch input{width:100%;height:38px;border:1px solid var(--rule);border-radius:999px;padding:0 14px 0 36px;font-size:13.5px;background:var(--card);color:var(--ink)}
    .nsearch input:focus{outline:none;border-color:var(--accent)}
    .nsearch svg{position:absolute;left:13px;top:12px;color:var(--muted)}
    .ncount{font-size:12px;color:var(--ink3);white-space:nowrap}
    .ndbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 26px 18px}
    .nsec{border-bottom:1px solid var(--rule)}
    .nsec summary{list-style:none;display:flex;align-items:baseline;gap:10px;padding:12px 0;cursor:pointer;font-size:13.5px;font-weight:400;line-height:1.35}
    .nsec summary::-webkit-details-marker{display:none}
    .nsec summary::before{content:"";flex:none;width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;
      transform:translateY(-1px);transition:transform .12s;opacity:.7}
    .nsec[open] summary::before{transform:translateY(-1px) rotate(90deg)}
    .nsec summary small{margin-left:auto;font-weight:400;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
    .ntable{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 12px}
    .ntable th{text-align:left;font-weight:600;font-size:11.5px;color:var(--ink3);padding:5px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
    .ntable td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.4}
    .ntable tr:last-child td{border-bottom:0}
    .ntable .r{width:62px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
    .ntable .p{width:66px;white-space:nowrap}
    .ntable .v{width:64px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .ntable th.v{text-align:right}
    .ntable td.v b{font-weight:600}
    .ntable td small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
    .ntable tr.nrow{cursor:pointer}
    .ntable tr.nrow:hover td,.ntable tr.nrow:focus-visible td{background:var(--accent-soft)}
    .ntable tr.nrow:focus-visible{outline:none}
    .ntable tr.sel td{background:var(--soft)}
    .ntable tr.sel td.r::before{content:"✓ ";color:var(--accent);font-weight:700}
    .ntable tr.na{color:var(--muted);cursor:not-allowed}
    .ndfoot{padding:12px 26px 16px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink3);line-height:1.45}
    .nempty{padding:28px 0;color:var(--ink3);font-size:13.5px}
    mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px}
    .stroomw .vmenu{left:0;right:auto;min-width:240px}
    .vmenu .vmsep{height:1px;background:var(--rule);margin:6px 2px}
    .vmenu button.vmadd{color:var(--accent);font-weight:600}
    .vmroom{position:relative;display:flex}
    .vmroom > button[data-room]{flex:1;min-width:0;padding-right:34px}
    .vmenu .vmroom .vmdel{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;padding:0;border-radius:999px;
      justify-content:center;font-size:16px;line-height:1;color:var(--ink3);opacity:0;display:inline-flex;align-items:center}
    .vmroom:hover .vmdel,.vmroom .vmdel:focus-visible{opacity:1}
    .vmenu .vmroom .vmdel:hover{color:var(--err);background:var(--soft)}
    .sbtools{display:flex;align-items:center;gap:8px;flex:none}
    /* language switch (stage 8): RU | EN | DE, the choice reloads the page */
    .seg.langsw{padding:2px}
    .seg.langsw button{height:30px;padding:0 10px;font-size:12px;letter-spacing:.02em}
    .sbbtn{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
      font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
    .sbbtn:hover{border-color:var(--ink)}
    .sbbtn.round{width:36px;padding:0;justify-content:center;font-size:14px;font-weight:600}
    .sbbtn.round[aria-expanded="true"]{border-color:var(--ink)}
    /* tooltips with the hot key: data-tip and data-key on buttons of the bar and the view */
    [data-tip]{position:relative}
    .tipr[data-tip]::after,.tipl[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);white-space:nowrap;
      background:var(--sel);color:var(--on-sel);font-size:12px;font-weight:400;line-height:1;padding:6px 9px;border-radius:6px;
      pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .08s,transform .08s;z-index:60;letter-spacing:0}
    .tipr[data-tip]::after{right:0} .tipl[data-tip]::after{left:0}
    [data-tip][data-key]::after{content:attr(data-tip) " · " attr(data-key);white-space:pre}
    .tipr[data-tip]:hover::after,.tipr[data-tip]:focus-visible::after,.tipl[data-tip]:hover::after,.tipl[data-tip]:focus-visible::after{opacity:1;transform:none}
    @media (hover:none){ .tipr[data-tip]::after,.tipl[data-tip]::after{display:none} }
    .stage[hidden]{display:none!important}

    /* stage 1: project */
    .pstage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto}
    .pcard{width:min(680px,100%);display:flex;flex-direction:column}
    .pbody{padding:30px 36px 8px;display:flex;flex-direction:column;gap:18px}
    .gskick{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
    .gshd{display:flex;flex-direction:column;gap:6px}
    .gshd h1{margin:0;font-size:28px;font-weight:600;line-height:1.15}
    .gshd p{margin:0;font-size:14px;color:var(--ink3);line-height:1.45}
    .tfld{display:flex;flex-direction:column;gap:5px}

    .tfld input{height:36px}
    .tfld textarea{min-height:92px;resize:vertical;line-height:1.45;font-family:inherit}

    .tfld.bad input{border-color:var(--err)}
    .tfld .ferr{font-size:11px;color:var(--err);line-height:1.3}

    .phonew{display:flex;gap:6px}
    .phonew input{flex:1;min-width:0}
    .phonew select{height:36px;flex:none;border:1px solid var(--rule);border-radius:5px;padding:0 6px;font-size:14px;background:var(--card);color:var(--ink)}
    .phonew select:focus{outline:none;border-color:var(--accent)}
    .phonec:empty{display:none}
    #infomsg{font-size:13px}
    .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
    .tgrid .wide{grid-column:1/-1}
    .gsfoot{display:flex;align-items:center;gap:12px;padding:16px 36px 22px;border-top:1px solid var(--rule);margin-top:18px}
    .gsgo{height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);
      font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:10px;cursor:pointer;margin-left:auto;white-space:nowrap}

    .gssec{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
      font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
    .gssec:hover{border-color:var(--ink)}
    .gsmsg{font-size:12.5px;color:var(--ink3)} .gsmsg.err{color:var(--err)}

    /* stage 2: name of the room, buttons at the bottom of the results */
    .fld.text input{padding:0 10px}
    .rfoot{margin-top:auto;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--rule);
      padding:14px 20px;display:flex;gap:8px;align-items:center}

    .rfoot .gssec{flex:1 1 auto;justify-content:center}

    /* split pill of the view: show / hide the plane | choose it */
    .vsplit{display:flex;height:34px;border-radius:999px;border:1px solid var(--rule);background:var(--card)}
    .vsplit > button{height:100%;border:0;background:none;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;
      font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .vsplit .vsl{padding:0 9px 0 11px;border-radius:999px 0 0 999px}

    .vsplit > button:hover{color:var(--ink);background:var(--soft)}
    .vsplit.on{background:var(--sel);border-color:var(--sel)}
    .vsplit.on > button{color:var(--on-sel);font-weight:600}
    .vsplit.on > button:hover{background:color-mix(in srgb,var(--on-sel) 12%,transparent);color:var(--on-sel)}

    /* stage 3: report tree | preview */

    .rtree .rn{display:flex;align-items:center;gap:8px;min-height:30px;border-radius:6px;padding:0 6px}
    .rtree .rn:hover{background:var(--soft)}
    .rtree .rn input{accent-color:var(--accent);margin:0;flex:none}
    .rtree .rn button{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;flex:1;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rtree .rn.room button{font-weight:600}
    .rtree .rn .rl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rtree .rn.room .rl{font-weight:600}
    .rtree .rn .tg{flex:none !important;width:18px;height:18px;padding:0;border:0;background:none;cursor:pointer;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center}
    .rtree .rn .tg::before{content:"";border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
    .rtree .rn .tg[aria-expanded="true"]::before{transform:rotate(90deg)}
    .rtree .rn .tgsp{width:18px;flex:none}
    .rtree .rn small{color:var(--ink3);font-variant-numeric:tabular-nums}

    .rprev{position:relative;overflow:hidden;background:var(--soft)}
    .rprev iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
    .rbusy{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:2}
    .rtreecard .gsfoot{margin-top:0;padding:14px 22px 18px;flex-wrap:wrap}
    .rtreecard .gsfoot .gsgo{margin-left:0;flex:1 1 auto;justify-content:center}

    /* developer details */

    .devbody{display:flex;flex-direction:column;gap:12px;margin-top:14px}
    .devbody .shd{font-size:13px;margin-top:6px}

    @media (max-width:1279.98px){
      .wrap{height:auto;min-height:100%}

      .side{overflow:visible}
      .apptitle,.stagebadge{display:none}

      .rstage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 70vh}

      .vhint{display:none}

      .fsec{padding-left:14px;padding-right:14px}

    /* stage 2.1: luminaire types and groups */

  let photFile = null;  // { table, phot, shape, key, name, set, values } of the loaded IES / LDT file
  // ---- project (stage 7): rooms, the active one, results kept per room ----

  const fileCache = new Map(); // file key → { table, phot, shape, key, name } (null: does not read)
  /** Parsed photometric file of a type, or null (cosine model, or a file that does not read). */
  function fileOfType(ty) {

  function sizeOf(ty) {
    const f = fileOfType(ty);

  }
  function renderInLum(m) {
    const host = $('#inlum'), r = inLumItems(m);
    host.hidden = !r;
    if (!r) { host.innerHTML = ''; return; }
    const { g, its } = r, n = groupCount(g);
    const same = (k) => its.every((it) => Math.abs(it[k] - its[0][k]) < 1e-9);
    const title = its.length === 1 ? t('lum.lumOf', { k: its[0].index + 1, n }) : t('lum.lumsOf', { k: its.length, n });
    const cell = (k, ax, unit, digits) => `<div class="gf"><span class="gax">${ax}</span><input data-il="${k}" inputmode="decimal" autocomplete="off" spellcheck="false" value="${same(k) ? esc(formatNumber(its[0][k], digits)) : ''}" title="${esc(unit)}"></div>`;
    const moved = its.some((it) => g.offs?.[it.index]);
    host.innerHTML = `<div class="ilh"><span>${esc(title)}</span>${moved ? `<small>${esc(t('lum.moved'))}</small>` : ''}</div>`
      + `<div class="gcells">${cell('x', 'X', t('unit.m'), 3)}${cell('y', 'Y', t('unit.m'), 3)}${cell('hm', 'Z', t('unit.m'), 3)}${cell('psi', 'ψ', '°', 1)}</div>`;
  }
  $('#inlum').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset.il) { e.preventDefault(); e.target.blur(); } e.stopPropagation(); });
  $('#inlum').addEventListener('change', (e) => {
    const k = e.target.dataset.il, v = parseNumber(e.target.value), m = model(), r = inLumItems(m);
    if (!k || !r || !Number.isFinite(v)) { renderInLum(m); return; }
    const it0 = r.its[0];
    let next = m;
    if (k === 'psi') next = rotateSelection(m, sel, v - it0.psi);
    else if (k === 'hm') next = liftSelection(m, sel, v - it0.hm, sizeOf);
    else {
      const [dx, dy] = clampDelta(r.its, k === 'x' ? v - it0.x : 0, k === 'y' ? v - it0.y : 0, m.room.shape.L, m.room.shape.W);
      next = moveSelection(m, sel, dx, dy);
    }
    if (next !== m) { remember(m); activeRoom().model = next; previewLums(); autosave(); refresh(); }
    else renderInLum(m);
  });
  /** The fields: of the group in focus, else of the next group to draw. */
  function loadGroupForm() {
    renderInLum(model());
    const m = model(), g = !isEmpty(sel) ? m.groups.find((x) => x.id === selGroup) : null;
    const several = !isEmpty(sel) && multiItems(m);
    if (several) { const mg = multiGroup(several); gform.load({ group: mg.group }, { ...gctx(m, null), at: 0, multi: true, blank: mg.blank }); }
    else if (g) gform.load({ group: g }, gctx(m, g));
    else gform.load({ kind, draft: drafts[kind] }, gctx(m, null));
    renderLum(m, lastPer);
  }
  const gctx = (m, g) => ({ H: m.room.H, L: m.room.shape.L, W: m.room.shape.W, others: g ? lumCount(m) - groupCount(g) : lumCount(m), at: selPoint });

  /** The room form changed (the room, the norms, the selected type). */
  function update(values) {
    current = values;
    const ar = activeRoom();
    if (ar && !switching) {
      const H0 = ar.model.room.H, prev = ar.model;
      ar.model = applyTypeValues(applyRoomValues(ar.model, values), selType, values);
      const ty = (m) => m.types.find((x) => x.id === selType);
      if (JSON.stringify([roomValues(prev), ty(prev) && typeValues(ty(prev))]) !== JSON.stringify([roomValues(ar.model), ty(ar.model) && typeValues(ty(ar.model))])) remember(prev);
      if (ar.norm && !normMatches(ar.norm, values)) ar.norm = null; // edited by hand
      if (values.H !== H0) loadGroupForm();                           // a height may have followed the room
      else gform.context(gctx(ar.model, ar.model.groups.find((g) => g.id === selGroup)));
      autosave();
    }
    refresh();
  }

  /** The model of the active room changed: the lists, the view, the placement check, the calculation. */
  function refresh() {
    const ar = activeRoom();
    if (!ar || !current) return;
    const m = ar.model, values = current;
    renderNormSrc();
    showCentre(m);
    renderInLum(m);
    fillTypeIn();
    if (document.body.classList.contains('nolums') !== (stage === 2 && !m.groups.length)) applyColorMode();
    const place = showPlacement(m);
    lastPer = place.per;
    renderLum(m, place.per);
    showHint();
    const roomKey = `${values.L}|${values.W}|${values.H}`;
    if (roomKey !== lastRoomKey) {
      const h = autoStep(values.L, values.W, values.H); // the subdivision step is automatic
      room = createRoom({ L: values.L, W: values.W, H: values.H, h });
      const f = (x) => formatNumber(x, 4);
      $('#mesh').innerHTML =
        row(t('app.meshStep'), f(h)) +
        row('n<sub>L</sub> × n<sub>W</sub> × n<sub>H</sub>', `${room.n.L} × ${room.n.W} × ${room.n.H}`) +
        row(`Δ<sub>L</sub> · Δ<sub>W</sub> · Δ<sub>H</sub>, ${t('unit.m')}`, `${f(room.d.L)} · ${f(room.d.W)} · ${f(room.d.H)}`) +
        row(t('app.meshN'), group(room.N));
      $('#faces tbody').innerHTML = room.faces.map((fc) =>
        `<tr><td><span class="sw" style="background:${FACE_COLORS[fc.id] ?? '#ccc'}"></span>${fc.id} · ${fc.name}</td>
         <td>${fc.nu} × ${fc.nv}</td><td>${group(fc.count)}</td></tr>`).join('');
      const checks2 = stage2Checks(room);
      $('#checks2').innerHTML = checkList(checks2);
      window.__stage2 = { room, checks: checks2 };
      if (view) {
        view.setRoom(room);
        const checks = view.selfCheck();
        $('#checks').innerHTML = checkList(checks);
        window.__stage1 = { room, checks, view };
      }
      result = null; shown = null;
      lastRoomKey = roomKey;
    }
    if (!busy && !pending) setBusy('');
    // luminaires follow the form at once, with or without a result
    let p;
    try { p = paramsOf(m); } catch (e) {
      setBusy(t('app.calcError', { msg: e.message }), true);
      return;
    }
    view?.setLuminaires(viewSets(m, p));
    view?.refresh();
    // a luminaire outside the room or too low: nothing is calculated until it is moved
    if (!place.ok) {
      sentKey.v = '';
      clearResult();
      setBusy(t('lum.notCalc'), true);
      updateCalcButton();
      return;
    }
    // Recalculate only when the calculation inputs changed; MF is applied here (E = MF · E₀).
    // The table itself is not part of the key: fileKey identifies it. Without the automatic update
    // a change drops the result until "Calculate" is pressed.
    const key = paramsKey(p);
    // a result kept for this room (another room was shown meanwhile, or the report computed it)
    const kept = roomResults.get(project.active);
    if (kept && kept.key === key && kept.result.N === room.N && key !== resultKey) {
      sentKey.v = key;
      adopt(kept.result, key);
      updateCalcButton();
      return;
    }
    if (autoCalc) {
      if (key !== sentKey.v) { sentKey.v = key; request(p); } else render();
    } else if (key !== resultKey) clearResult();
    else render();
    updateCalcButton();
  }

  function calculate() {
    if (!current) return;
    let p;
    if (placementErrors(model(), sizeOf).length) { setBusy(t('lum.notCalc'), true); return; }
    try { p = paramsOf(model()); } catch (e) { setBusy(t('app.calcError', { msg: e.message }), true); return; }
    sentKey.v = paramsKey(p);
    request(p);
    updateCalcButton();
  }
  function updateCalcButton() {
    $('#calc').disabled = autoCalc;
    $('#auto').checked = autoCalc;
  }

  /** No result for the current parameters (manual calculation): faces neutral, no figures. */
  function clearResult() {
    result = null; resultKey = ''; shown = null;
    planDraw = null;
    view?.setValues(null); view?.setLuminance(null, 0); view?.setPlane(null);
    $('#planes').innerHTML = '';
    $('#planenote').textContent = t('app.changed');
    $('#results tbody').innerHTML = ''; $('#mfnote').textContent = '';
    $('#checks6').hidden = $('#checks6h').hidden = true;
    renderPlaneMenu();
  }

  function onResult(id, r) {
    busy = false;
    if (!pending) setBusy('');
    const rk = `${r.key}`;
    const job = jobKeys.get(id) ?? { key: '', roomId: null }; jobKeys.delete(id);
    const key = job.key;
    if (job.roomId) roomResults.set(job.roomId, { key, result: r });
    // without the automatic update a result for parameters changed meanwhile is dropped; a result of
    // another room is only kept for it
    let fresh = autoCalc;
    if (!fresh && current) { try { fresh = key === paramsKey(paramsOf(model())); } catch (e) { fresh = false; } }
    if (job.roomId === project.active && rk === lastRoomKey && room && r.N === room.N && fresh) adopt(r, key);
    flush();
  }

  /** Shows a result of the active room: the views, the results column and the developer panels. */
  function adopt(r, key) {
    {
      result = r; resultKey = key;
      // the plane at h disappears when h becomes 0 or 0.8 m: show the normative plane instead
      const zs = r.planes.map((q) => zKey(q.z)), norm = r.planes.find((q) => q.normative).z;
      if (planeZ != null && !zs.includes(zKey(planeZ))) planeZ = norm;
      render();
      $('#timing').innerHTML =
        row(t('app.tKernel'), r.reused.kernel ? t('app.cached') : t('app.tKernelDetail', { a: ms(r.ms.kernel), b: ms(r.ms.coarse) })) +
        row(t('app.tDirect'), r.reused.direct ? t('app.cached') : t('app.tDirectDetail', { a: ms(r.ms.direct), l: r.lums.length, n: group(r.N) }) +
          (r.directStats ? t('app.tEvals', { n: Math.round(r.directStats.evals / (r.lums.length * r.N)) }) : '')) +
        row(t('app.tSolver'), t('app.tSolverDetail', { a: ms(r.ms.solve), n: r.iterations })) +
        row(t('app.tPlanes'), ms(r.ms.planes)) +
        row(t('app.tChecks'), ms(r.ms.checks));
      $('#checks3').innerHTML = r.checks3 ? checkList(r.checks3) : '';
      const c4 = [...(r.checks4 ?? [])];
      const ex = view?.exposureCheck();
      if (ex && r.checks4) {
        c4.splice(3, 0, {
          name: t('chk.s4.exposure'),
          ok: ex.same,
          detail: t('chk.s4.exposureDetail', { n: ex.views, m: sci(ex.values[0], 3), l: formatNumber(shown.Lwa, 2) }),
        });
      }
      $('#checks4').innerHTML = checkList(c4);
      $('#checks5').innerHTML = r.checks5 ? checkList(r.checks5) : '';
      $('#checks5').hidden = $('#checks5h').hidden = !r.checks5;
      window.__stage5 = { room, result: r, checks: r.checks5 ?? null, file: photFile };
      window.__stage3 = { room, result: r, checks: r.checks3 };
      window.__stage4 = { room, result: r, checks: c4, shown, exposure: ex };
    }
  }

  /**
   * Work planes: a collapsed row per plane (Ē and U₀), details inside. The normative plane gets the
   * status marks: Ē against the required illuminance (red below it, green within its step of the
   * scale, orange above) and U₀ (red below 0.3); the others are marked * (for reference).
   */
  const PLAN_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M4 13.5c0-3 2-5 4-5s4 2 4 5M6 13.5c0-1.6.9-2.8 2-2.8s2 1.2 2 2.8"/></svg>';

  function renderPlanes(mf) {
    const host = $('#planes');
    const open = new Set([...host.querySelectorAll('details[open]')].map((d) => d.dataset.z));
    const n0 = (x) => formatNumber(x, 0), n2 = (x) => formatNumber(x, 2);
    const LABEL = { low: t('app.levelLow'), ok: t('app.levelOk'), high: t('app.levelHigh') };
    // status marks: green tick, red cross, yellow warning (the final icons may change)
    const ICON = {
      ok: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.4 5.6 10.4 11.5 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      low: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5 10.5 10.5M10.5 3.5 3.5 10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
      high: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6 13 12.2H1z" fill="currentColor"/><path d="M7 5.4v3.4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="10.4" r=".85" fill="#fff"/></svg>',
    };
    const mark = (kind, title) => `<span class="st ${kind}" role="img" aria-label="${title}" title="${title}">${ICON[kind]}</span>`;
    let ref = false;
    host.innerHTML = result.planes.map((pl) => {
      const st = pl.stats, avg = mf * st.avg, min = mf * st.min, max = mf * st.max, u0 = st.u0;
      const name = planeName(pl.z);
      const on = planeZ != null && zKey(planeZ) === zKey(pl.z);
      const level = pl.normative ? levelStatus(avg, current.En) : null;
      // U₀: below the norm — red cross, at or above it — green tick; no norm: a warning below 0.3
      const uMark = !pl.normative ? null : current.U0n != null ? (u0 < current.U0n - 1e-9 ? 'low' : 'ok') : u0 < 0.3 - 1e-9 ? 'high' : null;
      const uTitle = { low: t('app.u0Low', { u: formatNumber(current.U0n ?? 0, 2) }), ok: t('app.u0Ok', { u: formatNumber(current.U0n ?? 0, 2) }), high: t('app.u0None') }[uMark];
      if (!pl.normative) ref = true;
      return `<details class="prow" data-z="${pl.z}"${open.has(String(pl.z)) ? ' open' : ''}>
        <summary><span class="pn">${name}${pl.normative ? '' : '*'}</span>
          <span class="pv"><i>Ē</i> ${n0(avg)} ${t('unit.lx')}${level ? ` ${mark(level, t('app.levelTitle', { what: LABEL[level], e: current.En }))}` : ''}</span>
          <span class="pv"><i>U₀</i> ${n2(u0)}${uMark ? ` ${mark(uMark, uTitle)}` : ''}</span>
          <button type="button" class="pplan" data-z="${pl.z}" aria-pressed="${on}" aria-label="${t('app.isoAria', { name })}" title="${t('app.isoTip', { name })}">${PLAN_ICON}</button></summary>
        <div class="gstech">
          ${row('Ē', `${n0(avg)} ${t('unit.lx')}`)}
          ${row('E<sub>min</sub>', `${n0(min)} ${t('unit.lx')}`)}
          ${row('E<sub>max</sub>', `${n0(max)} ${t('unit.lx')}`)}
          ${row('U<sub>0</sub> = E<sub>min</sub> / Ē', n2(u0))}
          ${row('U<sub>d</sub> = E<sub>min</sub> / E<sub>max</sub>', n2(st.minMax))}
        </div></details>`;
    }).join('');
    $('#planenote').innerHTML = ref ? t('rep.refNote') : '';
  }

  /**
   * The plane on the view: values of the shown map (total, direct or reflected) with MF at the nodes
   * of the auxiliary grid, isolines of exactly these values and the numbers at the GOST points.
   * On the plan the plane is opaque, in false colours when they are on, else neutral; in 3D it is a
   * neutral semi-transparent layer (false colours apply to the faces only).
   */
  function applyPlane() {
    $('#falsecolors').setAttribute('aria-pressed', String(buttonOnPlane() ? planeColors : is2D ? falsePlan : falseOn));
    const empty = document.body.classList.contains('nolums');
    const pl = planeZ != null && result && !empty ? result.planes.find((q) => zKey(q.z) === zKey(planeZ)) : null;
    const f = pl?.field;
    if (!view) return;
    if (!f) {
      planDraw = null;
      view.setPlane(null);
      view.setPlaneDisplay('off');
      $('#checks6').hidden = $('#checks6h').hidden = true;
      return;
    }
    const mf = current.mf;
    const pick = (o) => (mapMode === 'direct' ? o.Edir : mapMode === 'indirect' ? o.Eref : o.E);
    const values = Float64Array.from(pick(f), (v) => mf * v);
    const { ax, ay, dx, dy, L, W } = f.grid;
    const sets = isolineSet(values, ax, ay, dx, dy, LEVELS.slice(1));
    planDraw = { z: f.z, L, W, ax, ay, values, sets, gost: { ...f.gost, values: Float64Array.from(pick(f.gost), (v) => mf * v) } };
    view.setPlane({ z: f.z, ax, ay, L, W, values });
    view.setPlaneLines(sets);
    view.setPlaneDisplay(is2D ? (planeColors ? 'plan-color' : 'plan-plain') : 'layer');

    // stage 6 checks on the shown plane (total illuminance)
    if ($('#dev').open) {
      const tot = Float64Array.from(f.E, (v) => mf * v);
      const c6 = stage6Checks(f, mapMode === 'total' ? sets : isolineSet(tot, ax, ay, dx, dy, LEVELS.slice(1)), mf, pl.stats);
      c6.unshift({ name: t('chk.s6.field', { plane: planeName(f.z) }), ok: true,
        detail: t('chk.s6.fieldDetail', { ax, ay, dx: formatNumber(dx, 3), gx: f.gost.nx, gy: f.gost.ny, r: ms(f.ms.reflected), d: ms(f.ms.direct), g: ms(f.ms.gost) }) });
      $('#checks6').innerHTML = checkList(c6);
      $('#checks6').hidden = $('#checks6h').hidden = false;
      window.__stage6 = { plan: f, sets, checks: c6 };
    }
  }

  /** The plane button of a results row: shows the plane, a second press hides it. */
  function togglePlane(z) {
    setPlaneZ(planeZ != null && zKey(planeZ) === zKey(z) ? null : z);
  }
  /** Shows the plane at z (null: none); the results rows and the view menu follow. */
  function setPlaneZ(z) {
    planeZ = z;
    if (z != null) planePick = z;
    if (result) renderPlanes(current.mf);
    renderPlaneMenu();
    applyPlane();
  }
  /** The menu of the view button "Work plane": the same choice as the results rows. */
  /** Plane of the left part of the pill: the last one chosen, else the normative one. */
  function planeChoice() {
    const planes = result ? result.planes : [];
    const hit = planePick != null && planes.find((q) => zKey(q.z) === zKey(planePick));
    return hit ? hit.z : planes.find((q) => q.normative)?.z ?? (current ? current.hwp : null);
  }

  function renderPlaneMenu() {
    const show = $('#planeshow'), zc = planeChoice();

    show.dataset.tip = planeZ != null ? t('app.hidePlane', { name: planeName(planeZ) }) : zc != null ? t('app.showPlane', { name: planeName(zc) }) : t('app.plane');
    const item = (z, label, note, on, dis = false) =>
      `<button type="button" role="menuitemradio" aria-checked="${on}" data-z="${z}"${dis ? ' disabled' : ''}><i>${on ? '✓' : ''}</i>${label}${note ? `<small>${note}</small>` : ''}</button>`;
    const planes = result ? result.planes : [];
    $('#planemenu').innerHTML = `<div class="vmh">${t('app.plane')}</div>` + item('', t('app.noPlane'), '', planeZ == null) +
      (planes.length ? planes.map((pl) => item(pl.z, planeName(pl.z), pl.normative ? t('app.normative') : t('rep.reference'),
        planeZ != null && zKey(planeZ) === zKey(pl.z))).join('')
        : item('-', t('app.noResult'), '', false, true));

  /**
   * Preliminary estimate of the number of luminaires (js/estimate.js, the method of the page
   * "Estimate of general lighting") and a grid with at least that many; the note says how many are
   * enough when the grid holds more.
   */
  function suggestGrid() {
    const m = model(), g = m.groups.find((x) => x.id === selGroup);
    const note = $('#estnote');
    if (!g || g.kind !== 'grid') { note.hidden = true; return; }
    const ty = m.types.find((x) => x.id === g.type), f = fileOfType(ty), v = current;
    const phot = f ? f.phot : createPhotometry({ type: 'cosine', flux: 1000 });
    const flux = f ? f.phot.flux : ty.flux;
    const a = g.area ?? { x0: 0, y0: 0, x1: v.L, y1: v.W };
    let e;
    try {
      e = estimate(meanCurve(phot), { L: v.L, W: v.W, H: v.H, hu: photometricHeight(g.hm, housingOf(ty)), hr: v.hwp, rp: v.rhoC, rc: v.rhoW, rr: v.rhoF, E: v.En, Ke: v.mf }, flux);
    } catch (err) {
      note.textContent = t('app.estNone');
      note.hidden = false; return;
    }
    // the other groups count against the limit of the room
    const max = MAX_LUMINAIRES - (lumCount(m) - groupCount(g));
    const grid = gridFor(e.N, a.x1 - a.x0, a.y1 - a.y0, 30, max);
    if (e.N > max || !grid || grid.n < e.N) {
      // a wrong flux in the file is the usual cause: say so and leave the grid as it is
      note.innerHTML = t('app.estTooMany', { lums: t('app.lums', { n: e.N }), raw: formatNumber(e.raw, 1), max, flux: formatNumber(flux, 0) });
      note.classList.add('warn'); note.hidden = false; return;
    }
    note.classList.remove('warn');
    note.innerHTML = t(grid.n > e.N ? 'app.estEnough' : 'app.estNeed', { n: e.N });
    note.title = t('app.estTip', { raw: formatNumber(e.raw, 1), u: formatNumber(e.u, 2), nx: grid.nx, ny: grid.ny, n: grid.n });
    note.hidden = false;
    setModel(replaceGroup(m, g.id, { ...g, nx: grid.nx, ny: grid.ny }), { form: true });
  }

  /** Puts an edited model of the active room in place; form: the group fields are loaded again. */
  function setModel(m, { form = false } = {}) {
    remember(activeRoom().model);
    activeRoom().model = m;
    if (form) loadGroupForm();
    autosave();
    refresh();
  }

  /** Applies MF, the map mode and the exposure to the last result (no recalculation). */
  function render() {
    if (!result || !current) return;
    const mf = current.mf;
    const N = result.N;
    const E = new Float64Array(N), Ed = new Float64Array(N), Ei = new Float64Array(N);
    for (let g = 0; g < N; g++) {
      Ed[g] = mf * result.Edir[g]; Ei[g] = mf * result.Eind[g]; E[g] = Ed[g] + Ei[g];
    }
    // ρ in the form may already differ from the result while a new one is computed: the luminance
    // uses the ρ of the result, so the picture always matches the illuminance it shows.
    const L = luminance(room, E, result.rho);
    const ex = exposure(room, L);
    shown = { E, Ed, Ei, L, Lwa: ex.Lwa, m: ex.m };

    const avg = faceAverages(room, E), avgD = faceAverages(room, Ed), avgI = faceAverages(room, Ei);
    const n0 = (x) => formatNumber(x, 0);
    $('#results tbody').innerHTML = room.faces.map((fc) =>
      `<tr><td>${fc.name}</td><td><b>${n0(avg[fc.id])}</b></td><td>${n0(avgD[fc.id])}</td><td>${n0(avgI[fc.id])}</td></tr>`).join('');

    autosave();
  }

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /** The pill of the second stage: name of the active room; its menu lists the rooms. */
  function renderRoomNav() {
    const ar = activeRoom();
    $('#stroomname').textContent = ar ? ar.name || t('app.untitled') : '—';
    const many = project.rooms.length > 1;
    $('#roommenu').innerHTML = `<div class="vmh">${t('app.rooms')}</div>` + project.rooms.map((r) => {
      const on = r.id === project.active;
      return `<div class="vmroom"><button type="button" role="menuitemradio" aria-checked="${on}" data-room="${r.id}"><i>${on ? '✓' : ''}</i>${esc(r.name || t('app.untitled'))}</button>` +
        (many ? `<button type="button" class="vmdel" data-del="${r.id}" aria-label="${esc(t('app.delRoomAria', { name: r.name || t('rui.aRoom') }))}" title="${t('app.delRoom')}">×</button>` : '') + '</div>';
    }).join('') + `<div class="vmsep"></div><button type="button" class="vmadd" data-act="add"><i>+</i>${t('app.newRoom')}</button>`;
  }
  const roomMenu = $('#roommenu'), roomBtn = $('#stroom');
  const closeRoomMenu = () => { roomMenu.hidden = true; roomBtn.setAttribute('aria-expanded', 'false'); };
  function openRoomMenu() { renderRoomNav(); roomMenu.hidden = false; roomBtn.setAttribute('aria-expanded', 'true'); }
  roomBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!roomMenu.hidden) closeRoomMenu(); else openRoomMenu();
  });
  $('#stcalc').addEventListener('click', () => setStage(2));
  roomMenu.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    closeRoomMenu();
    if (b.dataset.room) { switchRoom(b.dataset.room); setStage(2); }
    else if (b.dataset.act === 'add') addRoom();
    else if (b.dataset.del) deleteRoom(b.dataset.del);
  });
  document.addEventListener('click', (e) => { if (!roomMenu.hidden && !roomMenu.contains(e.target)) closeRoomMenu(); });

  $('#roomname').addEventListener('input', (e) => {
    e.stopPropagation(); // not a calculation input
    const r = activeRoom();
    r.name = e.target.value;
    renderRoomNav(); report.invalidate('rooms'); autosave();
  });
  $('#roomname').addEventListener('change', (e) => {
    e.stopPropagation();
    const r = activeRoom();
    if (!r.name.trim()) { r.name = nextRoomName(project.rooms.filter((x) => x !== r)); e.target.value = r.name; }
    renderRoomNav(); autosave();
  });

  /** Shows a stage: 1 — project, 2 — rooms, 3 — results (the report). */
  function setStage(n) {
    queueMicrotask(histButtons);
    // the documentation needs the project information; the calculation does not
    if (n === 3 && Object.keys(infoErrors(project.info)).length) {
      infoForce = true;
      n = 1;
      queueMicrotask(() => { showInfoErrors(); $('#infomsg').hidden = false; $('#infofields .tfld.bad input')?.focus(); });
    }
    stage = n;
    document.body.dataset.stage = String(n);
    for (const k of [1, 2, 3]) $(`#stage${k}`).hidden = k !== n;
    for (const b of document.querySelectorAll('#stnav .gsst')) {
      const k = Number(b.dataset.s);
      b.classList.toggle('cur', k === n); b.classList.toggle('done', k < n);
      if (k === n) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    }
    for (const l of document.querySelectorAll('#stnav .gsln')) l.classList.toggle('on', Number(l.dataset.l) < n);
    help.close(); closeRoomMenu();
    if (n === 3) report.open(); else report.leave();
    autosave();
  }
  for (const b of document.querySelectorAll('#stnav .gsst[data-s="1"], #stnav .gsst[data-s="3"]')) b.addEventListener('click', () => setStage(Number(b.dataset.s)));
  $('#go2').addEventListener('click', () => setStage(2));
  $('#go3').addEventListener('click', () => setStage(3));
  $('#newroom').addEventListener('click', addRoom);

  let savedText = null; // the project as last saved or opened (unsaved changes: another text)
  /** Downloads the project file (rooms with their photometric files; no results). */
  function saveProject() {
    const blob = new Blob([serializeProject(project)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = projectFileName(project);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(t('app.saved', { name: a.download }));
    savedText = serializeProject(project);
  }
  let toastTimer = 0;
  /** A short message at the bottom of the page. */
  function toast(text) {
    const el = $('#toast');
    el.textContent = text; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 6000);
  }
  function useProject(p, stageAfter) {
    project = p;
    savedText = serializeProject(p);
    infoTouched.clear(); infoForce = false; $('#infomsg').hidden = true;
    roomResults.clear();
    fillInfo();
    loadRoom(activeRoom());
    renderRoomNav();
    report.invalidate('all');
    setStage(stageAfter);
  }
  $('#savebtn').addEventListener('click', saveProject);
  /** Opens a project file from the header (any stage); unsaved changes: save them first? */
  function openFromHeader() {
    if (savedText !== serializeProject(project) && confirm(t('app.saveFirst'))) saveProject();
    $('#openfile').click();
  }
  $('#hopen').addEventListener('click', openFromHeader);
  $('#openbtn').addEventListener('click', () => $('#openfile').click());
  $('#openfile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const msg = $('#openmsg');
    try {
      const p = parseProject(await f.text());
      useProject(p, 1);
      msg.classList.remove('err');
      msg.textContent = t('app.opened', { name: f.name, rooms: t('app.roomsN', { n: p.rooms.length }) });
    } catch (err) { msg.classList.add('err'); msg.textContent = err.message; }
  });
  $('#newproj').addEventListener('click', () => {
    if (!confirm(t('app.newConfirm'))) return;
    $('#openmsg').textContent = '';
    useProject(createProject(), 1);
  });

  function startProject() {
    const saved = restoreProject();
    project = saved ?? createProject();
    savedText = serializeProject(project); // what this browser keeps counts as saved
    renderInfo();
    loadRoom(activeRoom());
    renderRoomNav();
    let st = 1;
    try { st = Number(localStorage.getItem(`${STORE}.stage`) ?? localStorage.getItem(`${STORE_V1}.stage`)) || (saved ? 2 : 1); } catch (e) { /* storage unavailable */ }
    // after a switch of the language the page comes back to the stage it was on, the documentation too
    let back = 0;
    try { back = Number(sessionStorage.getItem('lcalc.langStage')) || 0; sessionStorage.removeItem('lcalc.langStage'); } catch (e) { /* storage unavailable */ }
    setStage(back || (st === 3 ? 2 : st));
  }

  // ---- norms: source line and the codifier ----
  function renderNormSrc() {
    const n = activeRoom()?.norm;
    $('#normsrc').textContent = normSource(n);
  }
  const normDlg = initNormDialog({
    dialog: $('#normdlg'), set: $('#normset'), query: $('#normq'), body: $('#normbody'), count: $('#normcount'),
    note: $('#normnote'), close: $('#normclose'),
    current: () => activeRoom()?.norm ?? null,
    apply: (n) => {
      const r = activeRoom();
      r.norm = n;
      form.set({ En: n.En, hwp: n.hwp, U0n: n.U0n });
      renderNormSrc();
      autosave();
    },
  });
  $('#normpick').addEventListener('click', () => normDlg.open());

  // ---- help and hot keys ----
  function contextHelp() {
    const el = document.activeElement;
    const fld = el?.closest?.('.fld[id^="w-"], .tfld[id^="pi-"]');
    if (fld && !fld.closest('[hidden]')) { help.show(`f:${fld.id.replace(/^(w|pi)-/, '')}`, fld); return; }
    help.show(`stage${stage}`, $('#apphelp'));
  }
  $('#apphelp').addEventListener('click', (e) => {
    e.stopPropagation();
    if (help.isOpenFor($('#apphelp'))) help.close(); else help.show(`stage${stage}`, $('#apphelp'));
  });
  $('#planeshow').addEventListener('click', togglePlaneShown);
  document.addEventListener('keydown', (e) => {
    const a = hotkeyAction(e);
    if (!a) return;
    if (a === 'save') { e.preventDefault(); saveProject(); return; }
    if (a === 'open') { e.preventDefault(); openFromHeader(); return; }
    if (a === 'help') { e.preventDefault(); contextHelp(); return; }
    if (stage !== 2 || normDlg.isOpen()) return; // the view keys belong to the calculation stage
    e.preventDefault();
    if (a === 'plan') { if (view && !view.isPlan()) view.showPlan(); }
    else if (a === 'view3d') view?.show3D();
    else if (a === 'plane') togglePlaneShown();
    else if (a === 'calc') { if (!autoCalc) calculate(); }
    else if (a === 'falsecolors') $('#falsecolors').click();
    else if (a === 'reset') view?.resetView();
  });

  // ---- report (stage 3): results of every room, computed when missing ----
  let rworker = null, rmain = null, rseq = 0;
  const rjobs = new Map();
  function rejectAll(msg) { for (const j of rjobs.values()) j.reject(new Error(msg)); rjobs.clear(); }
  async function reportRun(params) {
    if (!rworker && !rmain) {
      try {
        rworker = new Worker(import.meta.resolve('./js/worker.js'), { type: 'module' });
        rworker.onmessage = (e) => {
          const m = e.data;
          if (m.type === 'ready') return; // started; jobs answer with their id
          if (m.id == null) { rworker.terminate(); rworker = null; rejectAll(m.message ?? 'worker'); return; }
          const j = rjobs.get(m.id); if (!j) return;
          rjobs.delete(m.id);
          if (m.type === 'result') j.resolve(m.result); else j.reject(new Error(m.message));
        };
        rworker.onerror = (e) => { e.preventDefault(); rworker?.terminate(); rworker = null; rejectAll(e.message); };
        rworker.postMessage({ type: 'init', imports, lang: getLang() });
      } catch (e) { rworker = null; }
    }
    if (rworker) {
      try {
        return await new Promise((resolve, reject) => { const id = ++rseq; rjobs.set(id, { resolve, reject }); rworker.postMessage({ type: 'run', id, params }); });
      } catch (e) { console.warn('Report calculation on the main thread:', e.message); }
    }
    if (!rmain) { const { createCalc } = await import('./js/calc.js'); rmain = createCalc(); }
    return rmain.run(params);
  }
  /** Inputs and result of a room for the report (computed when not kept). */
  async function roomData(r) {
    const m = r.model, size = { L: m.room.shape.L, W: m.room.shape.W };
    // the types with luminaires: colour, name, file, values, count, mounting heights (stage 2.1)
    const types = m.types.map((ty, k) => {
      const gs = m.groups.filter((g) => g.type === ty.id);
      const hm = gs.flatMap((g) => groupPoints(g, size).map((pt) => pt.hm));
      return { id: ty.id, color: typeColorOf(m, k), name: nameOfType(ty, k), file: fileOfType(ty), values: typeValues(ty), count: hm.length, hm };
    }).filter((ty) => ty.count);
    // a room with misplaced luminaires is not calculated: the report says where to fix it
    if (placementErrors(m, sizeOf).length) throw new Error(t('lum.reportBad', { name: r.name || t('app.untitled') }));
    const g0 = m.groups[0];
    const grid = m.groups.length === 1 && g0.kind === 'grid' && !g0.area;
    const first = types.find((ty) => ty.id === g0.type) ?? types[0];
    const values = { ...formValues(m), ...first.values, hm: first.hm[0] };
    const file = first.file;
    const params = { ...paramsOf(m), checks: false };
    const key = paramsKey(params);
    let kept = roomResults.get(r.id);
    if (!kept || kept.key !== key) {
      kept = { key, result: await reportRun(params) };
      roomResults.set(r.id, kept);
    }
    return { id: r.id, name: r.name, values, norm: r.norm ?? null, file, params, key, result: kept.result, types, grid };
  }
  const report = initReport({
    tree: $('#rtree'), iframe: $('#preview'), busy: $('#rbusy'), pdf: $('#pdfbtn'),
    project: () => project, roomData, FACE_COLORS: () => FACE_COLORS,
  });

  function toggle(btn, apply) {
    btn.addEventListener('click', () => {
      const on = btn.getAttribute('aria-pressed') !== 'true';
      btn.setAttribute('aria-pressed', String(on));
      apply(on);
    });
  }
  toggle($('#grid'), (on) => view?.setShowGrid(on));
  toggle($('#normals'), (on) => view?.setShowNormals(on));
  // Display mode: false colors (button in the view) or the realistic grey view; the developer toggle
  // shows placeholder colors by face number.
  function applyColorMode() {
    // on the plan: no luminance map, a plain fill unless false colours are on
    // no luminaires: the room lit from the camera, no false colours, planes or legend (25 Nov 2026)
    const dark = !!activeRoom() && stage === 2 && !model().groups.length;
    const mode = faceColors ? 'faces' : is2D ? (falsePlan && !dark ? 'false' : 'wire') : dark ? 'shade' : falseOn ? 'false' : 'real';
    document.body.classList.toggle('nolums', dark);
    view?.setColorMode(mode);
    applyPlane(); // on the plan the button colours the plane
    view?.refresh();
  }
  $('#falsecolors').addEventListener('click', () => {
    if (buttonOnPlane()) { planeColors = !planeColors; applyPlane(); return; }
    if (is2D) falsePlan = !falsePlan; else falseOn = !falseOn;
    applyColorMode();
  });
  toggle($('#plain'), (on) => { faceColors = on; applyColorMode(); });
  $('#mapmode').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    mapMode = b.dataset.v;
    for (const x of $('#mapmode').querySelectorAll('button')) {
      const on = x === b;
      x.setAttribute('aria-pressed', String(on)); x.setAttribute('aria-checked', String(on));
    }
    if (!falseOn) { falseOn = true; applyColorMode(); }
    render();
  });
  $('#stopsout').textContent = `0 ${t('unit.ev')}`;
  $('#stops').addEventListener('input', (e) => {
    stops = Number(e.target.value);
    $('#stopsout').textContent = `${stops > 0 ? '+' : stops < 0 ? '−' : ''}${formatNumber(Math.abs(stops), 1)} ${t('unit.ev')}`;
    view?.setExposureStops(stops);
  });
  $('#reset').addEventListener('click', () => view?.resetView());
  $('#plan').addEventListener('click', () => { if (!view?.isPlan()) view?.showPlan(); });
  $('#view3d').addEventListener('click', () => view?.show3D());

  $('#themebtn').addEventListener('click', () => {
    const r = document.documentElement;
    const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', r.dataset.theme); } catch (e) {}
    view?.refreshTheme();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => view?.refreshTheme());

  startProject();
</script>
</body>
</html>
